name: Deploy Admin Frontend

on:
  push:
    branches: [main]
    paths:
      - 'admin-frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install locked Wrangler
        working-directory: admin-frontend
        run: npm ci --ignore-scripts

      - name: Deploy to Cloudflare Pages
        working-directory: admin-frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT_NAME: ${{ vars.PAGES_PROJECT_NAME }}
          PAGES_BRANCH: ${{ inputs.environment == 'prod' && 'main' || 'dev' }}
        run: |
          publish_dir=$(mktemp -d)
          cp app.js config.js index.html "$publish_dir/"
          ./node_modules/.bin/wrangler pages deploy "$publish_dir" \
            --project-name="$PAGES_PROJECT_NAME" --branch="$PAGES_BRANCH"
