name: Promote to Production

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Workflow run ID to promote (leave empty for latest successful)'
        required: false
        type: string

permissions:
  contents: read

env:
  AWS_REGION: eu-north-1

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: aws-lambda-deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify dev run
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: bash .github/scripts/verify-dev-run.sh deploy-lambdas.yml "$RUN_ID"

      - name: Check out the matching SAM template
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.release.outputs.sha }}
          path: release

      - name: Download verified run artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lambda-artifacts
          path: release/infra/sam/artifacts/
          github-token: ${{ github.token }}
          run-id: ${{ steps.release.outputs.run_id }}
          digest-mismatch: error

      - name: Assume the environment deploy role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@341eee193f458fa5aae5d52c94b0c5cf3a1c5a52 # v3

      - name: Deploy to prod
        env:
          ALLOWED_DOMAIN: ${{ vars.ALLOWED_DOMAIN }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          SHORTLINK_DOMAIN: ${{ vars.SHORTLINK_DOMAIN }}
          CORS_ALLOW_ORIGIN: ${{ vars.CORS_ALLOW_ORIGIN }}
          CUSTOM_DOMAIN_NAME: ${{ vars.CUSTOM_DOMAIN_NAME }}
          CUSTOM_DOMAIN_CERT_ARN: ${{ vars.CUSTOM_DOMAIN_CERT_ARN }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          SAM_EXECUTION_ROLE_ARN: ${{ vars.SAM_EXECUTION_ROLE_ARN }}
        run: bash .github/scripts/deploy-sam.sh prod release/infra/sam
